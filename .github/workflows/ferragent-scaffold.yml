# Copy this file into Infra-Map's .github/workflows/ - it is NOT run from
# this repo (Ferragent-AI). See worker/README.md for the full setup.
#
# How the "project name -> secrets" mapping works:
# GitHub Environments give you this natively - create one Environment per
# project (Settings -> Environments -> New environment, e.g. "acme-prod"),
# and add that project's AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (or
# AZURE_*/GCP_* equivalents) as secrets scoped to that Environment. The job
# below sets `environment: ${{ inputs.project_name }}` so `secrets.*` always
# resolves to the right project's values, under the same secret names, with
# zero per-project workflow edits. This also gets you GitHub's own approval
# gate for free: add required reviewers to an Environment and any run
# against it pauses for a human "Approve" click before secrets are ever
# injected - exactly the manual approval step described for real deploys.
name: Ferragent Scaffold Controller

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Project name - must match an Environment name in this repo's settings"
        required: true
      cloud_provider:
        description: "aws | azure | gcp"
        required: true
        default: aws
      working_directory:
        description: "Path (relative to repo root) containing the scaffolded Terraform"
        required: true
      action:
        description: "plan | apply (writes real infrastructure, only if the Environment approves it) | describe (read-only AWS CLI lookup, no Terraform involved)"
        required: true
        default: plan
      resource_type:
        description: "describe only: a Terraform resource type, e.g. aws_iam_user, aws_iam_role, aws_s3_bucket"
        required: false
      resource_id:
        description: "describe only: the real-world identifier (name/ARN) to look up"
        required: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.project_name }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    # Job-level env so every step (including init, which also needs
    # credentials to reach an S3/azurerm/GCS backend) sees them - a
    # per-step env here was a bug, init was silently running with no
    # credentials at all. AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY is the
    # standard name every new project's Environment should use (see the
    # header comment); the fleminp_* fallback exists only because that's
    # what's currently set for the fleminp project specifically.
    env:
      AWS_ACCESS_KEY_ID: ${{ inputs.cloud_provider == 'aws' && (secrets.AWS_ACCESS_KEY_ID || secrets.fleminp_key) || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.cloud_provider == 'aws' && (secrets.AWS_SECRET_ACCESS_KEY || secrets.fleminp_secret) || '' }}
      ARM_CLIENT_ID: ${{ inputs.cloud_provider == 'azure' && secrets.ARM_CLIENT_ID || '' }}
      ARM_CLIENT_SECRET: ${{ inputs.cloud_provider == 'azure' && secrets.ARM_CLIENT_SECRET || '' }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.cloud_provider == 'azure' && secrets.ARM_SUBSCRIPTION_ID || '' }}
      ARM_TENANT_ID: ${{ inputs.cloud_provider == 'azure' && secrets.ARM_TENANT_ID || '' }}
      GOOGLE_CREDENTIALS: ${{ inputs.cloud_provider == 'gcp' && secrets.GOOGLE_CREDENTIALS || '' }}
    steps:
      - uses: actions/checkout@v4

      # Read-only, on-demand lookup of a real resource's current state via
      # AWS CLI - completely separate from the Terraform plan/apply flow, so
      # the chat can answer "what does X look like right now" without
      # needing a scaffold, a backend, or any Terraform files at all. Add a
      # case here for each new resource type as it comes up.
      - name: Describe existing resource (read-only, AWS only)
        if: inputs.action == 'describe' && inputs.cloud_provider == 'aws'
        working-directory: . # no Terraform files needed - don't require working_directory to exist
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.fleminp_key }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.fleminp_secret }}
        run: |
          case "${{ inputs.resource_type }}" in
            aws_iam_user) aws iam get-user --user-name "${{ inputs.resource_id }}" ;;
            aws_iam_role) aws iam get-role --role-name "${{ inputs.resource_id }}" ;;
            aws_iam_group) aws iam get-group --group-name "${{ inputs.resource_id }}" ;;
            aws_iam_policy) aws iam get-policy --policy-arn "${{ inputs.resource_id }}" ;;
            aws_s3_bucket)
              aws s3api get-bucket-location --bucket "${{ inputs.resource_id }}"
              aws s3api get-bucket-tagging --bucket "${{ inputs.resource_id }}" 2>/dev/null || echo "(no tags)"
              ;;
            *)
              echo "No describe case wired up yet for resource_type '${{ inputs.resource_type }}'."
              exit 1
              ;;
          esac

      - uses: hashicorp/setup-terraform@v3
        if: inputs.action != 'describe'

      # Ferragent AI's chat has no AWS credentials and can only guess a
      # region (or ask). This runner actually holds them, so it can just
      # look up the real region of the state bucket named in backend.tf and
      # correct both backend.tf and main.tf's provider block to match,
      # before init ever runs - removing an entire class of "wrong region"
      # failures regardless of what the chat assumed.
      - name: Auto-correct region from the real S3 backend bucket
        if: inputs.action != 'describe' && inputs.cloud_provider == 'aws'
        run: |
          BUCKET=$(grep -oP '(?<=bucket\s=\s")[^"]+' backend.tf | head -1)
          if [ -z "$BUCKET" ]; then
            echo "No S3 bucket found in backend.tf - skipping region auto-detection."
          else
            REAL_REGION=$(aws s3api get-bucket-location --bucket "$BUCKET" --query 'LocationConstraint' --output text 2>/dev/null || echo "")
            if [ "$REAL_REGION" = "None" ]; then REAL_REGION="us-east-1"; fi
            if [ -n "$REAL_REGION" ] && [ "$REAL_REGION" != "none" ]; then
              echo "Bucket '$BUCKET' actually lives in '$REAL_REGION' - syncing backend.tf/main.tf to match."
              sed -i "s/region *= *\"[a-zA-Z0-9-]*\"/region = \"$REAL_REGION\"/" backend.tf
              [ -f main.tf ] && sed -i "0,/region *= *\"[a-zA-Z0-9-]*\"/s//region = \"$REAL_REGION\"/" main.tf
            else
              echo "Could not determine the bucket's real region (it may not exist yet) - leaving backend.tf as generated."
            fi
          fi

      # The generating model occasionally misspells this exact Terraform
      # argument as "use_lock_file" (extra underscore) instead of
      # "use_lockfile" - cheap to just fix in place rather than trust every
      # generation to get a one-word spelling right.
      - name: Fix common backend.tf typo (use_lock_file -> use_lockfile)
        if: inputs.action != 'describe'
        run: sed -i 's/use_lock_file/use_lockfile/' backend.tf

      # The generating model is meant to write exactly one `provider` block
      # (in backend.tf), but occasionally duplicates it into main.tf too,
      # which Terraform rejects ("Duplicate provider configuration"). If
      # both files define one, strip the (simple, non-nested-brace) block
      # from main.tf and keep backend.tf's as the single source of truth.
      - name: Remove a duplicate provider block from main.tf if present
        if: inputs.action != 'describe'
        run: |
          if [ -f main.tf ] && grep -q '^provider "' backend.tf 2>/dev/null && grep -q '^provider "' main.tf 2>/dev/null; then
            echo "main.tf duplicates backend.tf's provider block - removing the one in main.tf."
            python3 -c "import re; c=open('main.tf').read(); c=re.sub(r'provider\s+\"[^\"]+\"\s*\{[^{}]*\}\n*', '', c); open('main.tf','w').write(c)"
          fi

      - name: Terraform init
        if: inputs.action != 'describe'
        run: terraform init

      # Ferragent AI's import scaffolds put native `import {}` blocks in a
      # dedicated import.tf (see IMPORT_SYSTEM_PROMPT in app/src/lib/groq.ts).
      # A plan/apply with those blocks present actually performs the import
      # against the real account - this is not a preview. If the resource
      # named in an import block doesn't actually exist yet, Terraform fails
      # the plan with "Cannot import non-existent remote object"; when that
      # specific failure happens, import.tf is removed and the plan is
      # retried as a plain create from the same resource block - so "import
      # if it exists, create if it doesn't" happens automatically, without
      # knowing in advance which case applies.
      - name: Terraform plan (attempts any import.tf automatically)
        id: plan_attempt
        if: inputs.action != 'describe'
        continue-on-error: true
        run: terraform plan -out=tfplan -no-color 2>&1 | tee plan_output.log

      - name: Fall back to create if the import target doesn't exist
        if: inputs.action != 'describe' && steps.plan_attempt.outcome == 'failure'
        run: |
          if [ -f import.tf ] && grep -qi "cannot import non-existent remote object" plan_output.log; then
            echo "Import target not found in the account - removing import.tf and creating it fresh instead."
            rm -f import.tf
            terraform plan -out=tfplan -no-color
          else
            echo "Plan failed for a reason other than a missing import target:"
            cat plan_output.log
            exit 1
          fi

      # Real writes only run for action=apply, and only after this job's
      # Environment approval gate (if the Environment has required
      # reviewers configured) has already let the job start.
      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve tfplan
